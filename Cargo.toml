[workspace]
resolver = "3"
members = ["crates/generic-lang", "crates/generic-lang-lib", "crates/generic-lang-api"]
# The plugin test fixtures are built out-of-band by `make plugin-test-fixture`
# and must not be part of the workspace: `cargo package --workspace` must not
# package them, `--locked` release builds must not resolve their deps, and
# `cargo test --workspace` must not build cdylibs nobody runs directly.
exclude = ["plugin-examples/rust"]

[workspace.package]
version      = "3.1.0"
edition      = "2024"
rust-version = "1.88"
authors    = ["Jan-Eric <janericnitschke@gmail.com"]
readme     = "README.md"
repository = "https://github.com/JanEricNitschke/generic-lang"
license    = "MIT"
keywords   = ["programming-language", "generic"]
categories = ["parser-implementations", "compilers"]

# Lints every member inherits via `[lints] workspace = true`, kept on even where
# they currently report nothing - that is what catches regressions. rustc has no
# `pedantic`-style group for these, so most are listed one by one.
[workspace.lints.rust]
# Unsafe discipline.
unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
ffi_unwind_calls = "warn"
# Groups that are free here.
keyword_idents = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
# Published-API hygiene: all three crates go to crates.io.
missing_docs = "warn"
missing_debug_implementations = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
# General hygiene.
absolute_paths_not_starting_with_crate = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unstable_features = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# Unsafe discipline. `multiple_unsafe_ops_per_block` is deliberately off.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Deliberately off: it contradicts `unreachable_pub` on items in private
# modules (rust-lang/rust-clippy#5369) - enforced in generic-lang-lib/src/lib.rs.
redundant_pub_crate = "allow"
# Correctness traps.
create_dir = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
# Placeholders and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
# Style, pinned so it cannot drift.
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
missing_assert_message = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
try_err = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"

[workspace.dependencies]
# default-features off so dependents (the bin) control the lib's features
# explicitly - that is what makes `--no-default-features` builds of the
# binary actually disable plugins.
generic-lang-lib = { version = "3.1.0", path = "crates/generic-lang-lib", default-features = false }
generic-lang-api = { version = "0.1.3", path = "crates/generic-lang-api" }

clap         = { version = "4.6.1", features = ["derive"] }
convert_case = "0.11.0"
derivative   = "2.2.0"
derive_more  = { version = "2.1.1", features = ["from", "not"] }
hashbrown    = "0.17.1"
indexmap     = "2.7.1"
humansize    = "2.1.3"
include_dir  = "0.7.4"
libloading   = "0.9.0"
num-bigint   = { version = "0.5.1" }
num-traits   = "0.2.19"
num_enum     = "0.7.6"
paste        = "1.0.15"
path-slash   = "0.2.1"
rand         = "0.10.1"
rustc-hash   = "2.1.2"
shrinkwraprs = "0.3.0"
slotmap      = "1.1.1"
strum        = { version = "0.28", features = ["derive"] }
serde_json   = { version = "1", features = ["arbitrary_precision"] }
ureq         = "3"
tempfile     = "3"
strum_macros = "0.28"
thiserror    = "2.0.18"
tinyvec      = { version = "1.10.0", features = ["alloc"] }
unicode-normalization = "0.1.25"
unicode-segmentation  = "1.13.2"
walkdir      = "2.5.0"

[profile.release]
lto           = true
codegen-units = 1
panic         = "abort"

[profile.stress_gc]
inherits = "dev"
