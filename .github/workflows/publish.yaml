name: Publish

# Dispatch-driven release workflow. A maintainer picks bump levels for the
# interpreter and/or the API crate; the workflow bumps versions, tags,
# builds, publishes, and creates GitHub Releases.
#
# The two version tracks are independent:
# - Interpreter (generic-lang + generic-lang-lib, shared workspace version):
#   full pipeline — crates.io, binaries, wheels, sdist, GitHub Release.
# - API crate (generic-lang-api, version 0.<abi>.<patch>): crates.io +
#   GitHub Release only.
#
# Tags use per-crate prefixes:
# - Interpreter:  vX.Y.Z                    (e.g. v3.0.0)
# - API crate:     generic-lang-api-vX.Y.Z   (e.g. generic-lang-api-v0.1.0)
#
# The `manual` option (both tracks) tags and publishes the current version
# without bumping — for crates already at their target version but not yet
# published.

on:
  workflow_dispatch:
    inputs:
      interpreter_bump:
        description: "Interpreter version bump (manual = first publish of current version)"
        required: true
        type: choice
        options: [none, manual, patch, minor, major]
      api_bump:
        description: "API crate version bump (minor = ABI bump; manual = first publish of current version)"
        required: true
        type: choice
        options: [none, manual, patch, minor]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BIN_NAME: generic

jobs:
  # ---------------------------------------------------------------------------
  # Bump jobs: compute new version(s), commit, tag, and push.
  # ---------------------------------------------------------------------------
  bump-api:
    name: Bump API crate version
    if: inputs.api_bump != 'none'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Tag the current (already-correct) version without running
      # cargo-release. Used for the first publish of a crate whose version
      # was bumped manually but never tagged.
      - name: Tag and push current version (manual)
        if: inputs.api_bump == 'manual'
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps |
            jq -r '.packages[] | select(.name == "generic-lang-api") | .version')
          git tag "generic-lang-api-v${VERSION}"
          git push origin "generic-lang-api-v${VERSION}"

      # Bump the API crate version via cargo-release. For a minor (ABI) bump,
      # also increment GENERIC_PLUGIN_ABI_VERSION in abi.rs before
      # cargo-release runs, then regenerate generic.h and verify the
      # crate_version_encodes_the_abi_version test still passes.
      # --no-push so the post-bump steps (header regen, test) happen before
      # the commit and tag are pushed.
      - name: Bump version (auto)
        if: inputs.api_bump != 'manual'
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "${GIT_AUTHOR_ID}+${GIT_AUTHOR_NAME}@users.noreply.github.com"
          cargo install cargo-release --locked
          if [ "${{ inputs.api_bump }}" = "minor" ]; then
            sudo apt-get update && sudo apt-get install -y make
            cargo install cbindgen --locked
            CURRENT_MINOR=$(cargo metadata --format-version=1 --no-deps |
              jq -r '.packages[] | select(.name == "generic-lang-api") | .version' |
              cut -d. -f2)
            NEW_ABI=$((CURRENT_MINOR + 1))
            sed -i -E "s/pub const GENERIC_PLUGIN_ABI_VERSION: u32 = [0-9]+;/pub const GENERIC_PLUGIN_ABI_VERSION: u32 = ${NEW_ABI};/" \
              crates/generic-lang-api/src/abi.rs
          fi
          cargo release ${{ inputs.api_bump }} -p generic-lang-api --no-publish --no-push --no-confirm --config release-api.toml --execute
          if [ "${{ inputs.api_bump }}" = "minor" ]; then
            make generate-plugin-header
            cargo test -p generic-lang-api crate_version_encodes_the_abi_version
          fi
          git add -A
          git commit --amend --no-edit
          git push origin "HEAD:${{ github.ref_name }}" --tags

      - name: Read version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps |
            jq -r '.packages[] | select(.name == "generic-lang-api") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=generic-lang-api-v$VERSION" >> "$GITHUB_OUTPUT"


  bump-interpreter:
    name: Bump interpreter version
    needs: [bump-api]
    if: ${{ !cancelled() && inputs.interpreter_bump != 'none' && needs.bump-api.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Tag the current (already-correct) version without running
      # cargo-release. Used for the first publish of a crate whose version
      # was bumped manually but never tagged.
      - name: Tag and push current version (manual)
        if: inputs.interpreter_bump == 'manual'
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps |
            jq -r '.packages[] | select(.name == "generic-lang-lib") | .version')
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      # Bump the workspace version via cargo-release, which also syncs the
      # generic-lang-lib dep pin in [workspace.dependencies], updates
      # Cargo.lock, commits, tags, and pushes.
      - name: Bump version (auto)
        if: inputs.interpreter_bump != 'manual'
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "${GIT_AUTHOR_ID}+${GIT_AUTHOR_NAME}@users.noreply.github.com"
          cargo install cargo-release --locked
          cargo release ${{ inputs.interpreter_bump }} --workspace --exclude generic-lang-api --no-publish --no-confirm --execute

      - name: Read version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps |
            jq -r '.packages[] | select(.name == "generic-lang-lib") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # crates.io publishing (both tracks share this job).
  # ---------------------------------------------------------------------------
  crates-io:
    name: Publish to crates.io
    needs: [bump-api, bump-interpreter]
    if: always() && (needs.bump-api.result == 'success' || needs.bump-interpreter.result == 'success')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Login to crates.io
        run: cargo login ${{ secrets.CRATES_IO_API_TOKEN }}

      - name: Publish changed crates
        run: |
          for crate in generic-lang-api generic-lang-lib generic-lang; do
            version=$(cargo metadata --format-version=1 --no-deps |
              jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if curl -fsSL "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" 2>/dev/null |
                jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "$crate $version is already on crates.io, skipping"
            else
              cargo publish -p "$crate"
            fi
          done

  # ---------------------------------------------------------------------------
  # Binary builds (interpreter releases only).
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build Binaries
    needs: [bump-interpreter]
    continue-on-error: true
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            command: cargo
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            command: cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            command: cross

          - target: aarch64-apple-darwin
            os: macos-14
            command: cargo

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            command: cargo
          - target: i686-pc-windows-msvc
            os: windows-latest
            command: cargo
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            command: cargo

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.command == 'cross'
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build for ${{ matrix.target }}
        run: ${{ matrix.command }} build --locked --release --target=${{ matrix.target }}

      - name: Rename and move binaries
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            mv target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe artifacts/${{ env.BIN_NAME }}-${{ matrix.target }}.exe
          else
            mv target/${{ matrix.target }}/release/${{ env.BIN_NAME }} artifacts/${{ env.BIN_NAME }}-${{ matrix.target }}
          fi
        shell: bash

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/*

  build-package:
    name: Package Crate
    needs: [bump-interpreter]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Package crates
        run: cargo package --workspace

      - name: Upload crate package as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crate
          path: target/package/*.crate

  linux:
    needs: [bump-interpreter]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          # ring's ARM asm needs __ARM_ARCH, which the manylinux gcc doesn't define.
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: [bump-interpreter]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          # ring's ARM asm needs __ARM_ARCH, which the musllinux gcc doesn't define.
          CFLAGS_aarch64_unknown_linux_musl: "-D__ARM_ARCH=8"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: [bump-interpreter]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: [bump-interpreter]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: [bump-interpreter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: dist

  # ---------------------------------------------------------------------------
  # PyPI upload (interpreter releases only).
  # ---------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: [bump-interpreter, linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

  # ---------------------------------------------------------------------------
  # GitHub Release (interpreter).
  # ---------------------------------------------------------------------------
  github-release-interpreter:
    name: GitHub Release (interpreter)
    needs: [bump-interpreter, build-binaries, build-package, linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-interpreter.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            wheels-*/*
            binary-*/*
            crate/*
            crates/generic-lang-api/include/generic.h
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ needs.bump-interpreter.outputs.tag }}
          name: Release ${{ needs.bump-interpreter.outputs.version }}
          generate_release_notes: true
          files: |
            wheels-*/*
            binary-*/*
            crate/*
            crates/generic-lang-api/include/generic.h
          draft: false
          prerelease: ${{ contains(needs.bump-interpreter.outputs.tag, 'alpha') || contains(needs.bump-interpreter.outputs.tag, 'beta') }}

  # ---------------------------------------------------------------------------
  # GitHub Release (API crate).
  # ---------------------------------------------------------------------------
  github-release-api:
    name: GitHub Release (API crate)
    needs: [bump-api, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-api.outputs.tag }}
      - name: Package API crate
        run: cargo package -p generic-lang-api
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ needs.bump-api.outputs.tag }}
          name: generic-lang-api ${{ needs.bump-api.outputs.version }}
          generate_release_notes: true
          files: |
            target/package/generic-lang-api-*.crate
            crates/generic-lang-api/include/generic.h
          draft: false
          prerelease: ${{ contains(needs.bump-api.outputs.tag, 'alpha') || contains(needs.bump-api.outputs.tag, 'beta') }}
