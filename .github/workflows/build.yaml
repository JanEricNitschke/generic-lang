# This workflow will build the rust interpreter of lox

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The make recipes are sh-based; on Windows this selects Git Bash so
        # find/for/sed/cp and env-var prefixes behave the same everywhere
        shell: bash
    steps:
    - name: Configure git line endings
      # The Windows runner defaults git to core.autocrlf=true, which rewrites
      # the committed LF header to CRLF on checkout and makes
      # check-plugin-header report spurious drift
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        components: rustfmt,clippy
        # Leave RUSTFLAGS unset so `.cargo/config.toml` rustflags apply - cargo
        # ignores config-file rustflags whenever RUSTFLAGS is set in the env,
        # and that file carries the Windows stack-size link-arg. `-D warnings`
        # moves there too so it still applies everywhere.
        rustflags: ""
    - name: Install make
      # Not preinstalled on the Windows runner
      if: runner.os == 'Windows'
      run: choco install make --yes --no-progress
    - name: Install cbindgen
      run: cargo install cbindgen --locked
    # Toolchains for the C/C++/Zig example plugins. cc/c++ are the runner's
    # own compilers; everything else tracks the latest stable release
    # automatically instead of pinning a version.
    - name: Set up Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: latest
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
    - name: Install C/C++ lint tools
      # Both wheels track the latest stable releases; no version pins.
      run: pip install clang-format cpplint

    - name: Check version sync
      # The workspace package version must match the generic-lang-lib dep pin
      # in [workspace.dependencies], and the generic-lang-api dep pin must
      # match the crate's own version. cargo-release keeps these in sync on
      # releases; this guard catches manual drift.
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        LIB_VER=$(cargo metadata --format-version=1 --no-deps |
          jq -r '.packages[] | select(.name == "generic-lang-lib") | .version')
        LIB_DEP=$(grep 'generic-lang-lib = {' Cargo.toml | grep -oP 'version = "\K[^"]+')
        [ "$LIB_VER" = "$LIB_DEP" ] || {
          echo "::error::generic-lang-lib version ($LIB_VER) != workspace dep pin ($LIB_DEP)"
          exit 1
        }
        API_VER=$(cargo metadata --format-version=1 --no-deps |
          jq -r '.packages[] | select(.name == "generic-lang-api") | .version')
        API_DEP=$(grep 'generic-lang-api = {' Cargo.toml | grep -oP 'version = "\K[^"]+')
        [ "$API_VER" = "$API_DEP" ] || {
          echo "::error::generic-lang-api version ($API_VER) != workspace dep pin ($API_DEP)"
          exit 1
        }
    - name: Build
      run: cargo build --verbose
    - name: Check Rust formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: |
        # Normal configuration, fail on default warnings (unscoped
        # invocations lint every workspace member, including the bin crate)
        cargo clippy -- -D warnings
        # Pedantic set
        cargo clippy --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo
    - name: Check generated plugin header
      # Regenerates the header and fails on drift - the header is purely
      # cbindgen's output, nothing else.
      run: make check-plugin-header
    - name: Lint example plugins
      # clang-format + cpplint (C/C++), zig fmt (Zig), rustfmt + clippy
      # (Rust - workspace-excluded, so the workspace-wide checks miss it).
      run: make plugin-lint
    - name: Check example plugins at the oldest supported standards
      # C99 / C++11; the fixture builds cover the newest (C23 / C++23).
      run: make plugin-std-check
    - name: Check API docs
      # The public plugin ABI must be fully documented (missing_docs) and its
      # rustdoc must build without warnings (broken links etc.)
      run: RUSTDOCFLAGS="-D warnings" cargo doc -p generic-lang-api --no-deps
    - name: Test
      run: |
        cargo test --verbose
        # The lib must also build and pass tests with plugins (and everything) off
        cargo test --no-default-features -p generic-lang-lib
    - name: Install Miri
      run: |
        rustup toolchain install nightly --component miri
        cargo +nightly miri setup
    - name: Test with MIRI
      run: |
        cargo +nightly miri test --verbose
    - name: Test with MIRI (i686)
      # `-Zmiri-symbolic-alignment-check` treats allocations as maximally
      # misaligned, catching pointer casts that assume stronger alignment
      # than the source type guarantees (i686: GenericValue is 4-aligned,
      # Value is 8-aligned).
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y gcc-multilib
        rustup target add i686-unknown-linux-gnu --toolchain nightly
        MIRIFLAGS=-Zmiri-symbolic-alignment-check cargo +nightly miri test --target i686-unknown-linux-gnu --verbose
    - name: Run an example with MIRI
      run: |
        MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri run -- test/overloading/overloading_for_in.gen
    - name: Check print_code_verbose
      run: |
        cargo run --features "print_code_verbose" test/function_literals/literals_as_decorators.gen
        cargo run --features "print_code_verbose" test/function/argument_unpacking.gen
    - name: Check trace_execution_verbose
      run: |
        cargo run --features "trace_execution_verbose" test/exceptions/exceptions_deep.gen
    - name: Check debug_parser
      run: |
        ! cargo run --features "debug_parser" test/function_literals/neither_block_nor_expression.gen
    - name: Check debug_scanner
      run: |
        cargo run --features "debug_scanner" test/fstrings/nested.gen
    - name: Setup dart
      uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      with:
        sdk: stable
    - name: Lint dart test runner
      run: make dart-lint
    - name: Run custom dart tests
      run: |
        cargo build
        make test
    - name: Run documentation samples
      # Executes the ```generic / ```generic-error code blocks in docs/.
      run: make docs-test
    - name: Run cross-language plugin tests
      # Builds the C/C++/Zig example plugins and runs the plugin-lang suite.
      run: make plugin-lang-test
    - name: Run plugin tests under valgrind
      # Memory errors across the dlopen/FFI boundary - one of the places miri
      # cannot look. Uses the fixtures built by the previous steps.
      # Linux only: valgrind has no Windows port and does not support recent macOS
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y valgrind
        make plugin-valgrind-test
    - name: Run plugin tests under AddressSanitizer
      # ASan-instrumented host + Rust plugin, ASan+UBSan C/C++ plugins.
      # Complements valgrind with compile-time instrumentation (stack bugs,
      # UB). Uses the nightly toolchain installed for miri.
      # Skipped on Windows: the Makefile's ASan wiring is POSIX-only;
      # macOS runs the trap-mode UBSan branch.
      if: runner.os != 'Windows'
      run: make plugin-asan-test

  powerset:
    # Feature powerset build + per-feature clippy on the lib crate, where the
    # features are defined (the bin crate's features are pure forwards).
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        components: clippy
        # See the build job: keep RUSTFLAGS unset so `.cargo/config.toml` wins.
        rustflags: ""
    - name: Install cargo-hack
      run: cargo install cargo-hack --locked
    - name: Feature powerset build
      run: cargo hack build --feature-powerset --skip print_code_builtin,trace_execution_builtin,debug_parser_builtin,debug_scanner_builtin --no-dev-deps -p generic-lang-lib
    - name: Clippy per feature
      run: cargo hack clippy --each-feature --no-dev-deps -p generic-lang-lib -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo

  cross-test:
    name: Cross test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - s390x-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Set CFLAGS for aarch64
        # ring's ARM asm needs __ARM_ARCH, which the cross container's gcc doesn't define.
        if: startsWith(matrix.target, 'aarch64')
        run: |
          echo "CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_unknown_linux_musl=-D__ARM_ARCH=8" >> "$GITHUB_ENV"
      - name: Cross test
        run: cross test --target ${{ matrix.target }} --workspace

  windows-cross-test:
    name: Windows test (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-gnu
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --target ${{ matrix.target }} --workspace

  benchmark:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        # See the build job: keep RUSTFLAGS unset so `.cargo/config.toml` wins.
        rustflags: ""
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
    - name: Install hyperfine
      run: cargo install --locked hyperfine
    - name: Set up Ruby
      uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
      with:
        ruby-version: "3.4"
    - name: Checkout book repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: munificent/craftinginterpreters
        path: reference/craftinginterpreters
    - name: Setup book repo
      working-directory: reference/craftinginterpreters
      run: |
        make clox
        make jlox
    - name: Run benchmarks
      run: make benchmark-ci

  downstream-tictactoe:
    # A real program in the language: the generic TicTacToe and its test
    # suite must keep passing against the interpreter at this revision.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
    - name: Build the interpreter
      run: cargo build
    - name: Checkout TicTacToe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: JanEricNitschke/TicTacToe
        path: downstream/TicTacToe
    - name: Run the TicTacToe test suite
      working-directory: downstream/TicTacToe/tictactoe_generic
      run: $GITHUB_WORKSPACE/target/debug/generic --test tests/
    - name: Play a winning and a drawing game
      # The move sequences mirror the assembly version's input files; the
      # greps assert the outcomes.
      working-directory: downstream/TicTacToe/tictactoe_generic
      run: |
        printf 'n\n0\n1\n2\n3\n4\n5\n6\n' | $GITHUB_WORKSPACE/target/debug/generic tictactoe_generic.gen | grep "Player X wins the game!"
        printf 'n\n0\n4\n8\n1\n7\n6\n2\n5\n3\n' | $GITHUB_WORKSPACE/target/debug/generic tictactoe_generic.gen | grep "Match Draw!"
